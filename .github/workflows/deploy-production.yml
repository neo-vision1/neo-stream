name: Deploy site de producao

on:
  push:
    branches:
      - main
    paths:
      - "camera-agent/cloudflare/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-vision-camera-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: camera-agent/cloudflare
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: camera-agent/cloudflare/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Validar Worker de producao
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Publicar Worker de producao
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: camera-agent/cloudflare
          command: deploy --config wrangler.jsonc
